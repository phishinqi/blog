name: Validate theme
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.5.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # The theme's browser suite targets the fixture posts and albums that this configured blog
      # intentionally removes. Keep it running for the template repository, while this site is
      # covered by the build, unit tests, and the content/schema checks above.
      - if: github.repository == 'phishinqi/astro-theme-v7'
        run: pnpm exec playwright install --with-deps chromium
      - if: github.repository == 'phishinqi/astro-theme-v7'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
